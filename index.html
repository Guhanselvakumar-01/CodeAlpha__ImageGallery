<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore my collection</p>
    </header>

    <main>

        
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="nature">Nature</button>
            <button class="filter-btn" data-category="animals">Animals</button>
            <button class="filter-btn" data-category="travel">Travel</button>
        </div>

        
        <div class="gallery">

            <div class="gallery-item" data-category="nature">
                <img src="images/image1.jpg" alt="Nature">
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="images/image2.jpg" alt="Animal">
            </div>

            <div class="gallery-item" data-category="travel">
                <img src="images/image3.jpg" alt="Travel">
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/image4.jpg" alt="Mountain">
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="images/image5.jpg" alt="Wildlife">
            </div>

            <div class="gallery-item" data-category="travel">
                <img src="images/image6.jpg" alt="Travel">
            </div>

        </div>

    </main>


    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button class="next" id="next">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
